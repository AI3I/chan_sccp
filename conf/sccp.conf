;
; sccp.conf - example configuration for chan_sccp
;
; A starting point: one simple phone, one phone with more buttons, and their
; lines. Replace the SEP names with your phones' MAC addresses and adjust the
; extensions and contexts to your dialplan.
;
; conf/sccp.conf.annotated in the source tree, or 'sccp config generate' on
; the Asterisk console, lists every option with its default. Options set in
; [general] are the defaults for all devices and lines.
;

[general]
servername = Asterisk               ; name shown on the phones
bindaddr = 0.0.0.0                  ; address to listen on
port = 2000                         ; SCCP port (the phone's TFTP file must match)
context = default                   ; dialplan context for lines without their own
keepalive = 60                      ; seconds between phone keepalives
dateformat = D/M/Y                  ; D, M and Y in any order; add A for a 12-hour clock
disallow = all
allow = ulaw
allow = alaw

; Only phones on private (RFC 1918) networks may register. Narrow this to
; your phone network, for example permit = 192.168.10.0/255.255.255.0
deny = 0.0.0.0/0.0.0.0
permit = internal
localnet = internal                 ; networks that are not behind NAT
;externip = 203.0.113.10            ; public address, if phones reach Asterisk through NAT

; Phones that are not listed below are refused. Set hotline_enabled = yes to
; let any phone register as a guest that dials hotline_extension when lifted.
hotline_enabled = no
;hotline_context = default
;hotline_extension = 111

;debug = device, channel            ; debug output; see 'sccp debug' on the console

; --------------------------------------------------------------------------
; A simple phone with one line
; --------------------------------------------------------------------------

[SEP001122334455]                   ; SEP + the phone's MAC address
type = device
devicetype = 7960
description = Front desk
button = line, 1000

[1000]
type = line
cid_name = Front Desk
cid_num = 1000
;label = Front Desk                 ; button text; defaults to cid_name
;mailbox = 1000@default             ; voicemail box for the message lamp
;vmnum = *97                        ; number dialed by the Messages button

; --------------------------------------------------------------------------
; A phone with a second line, speed dials and feature buttons
; --------------------------------------------------------------------------

[SEP00AABBCCDDEE]
type = device
devicetype = 7965
description = Office
button = line, 1001, default                    ; the line used when going off hook
button = line, 1002
button = speeddial, Front Desk, 1000, 1000@hints ; the lamp follows extension 1000's hint
button = feature, DND, DND, silent              ; do-not-disturb, ringer off
button = feature, Record, monitor               ; record the current call
;softkeyset = mysoftkeys                        ; use the softkey set defined below
;addon = 7914                                   ; expansion module

[1001]
type = line
cid_name = Office
cid_num = 1001
;pickupgroup = 1                    ; may pick up calls ringing in call group 1
;callgroup = 1

[1002]
type = line
cid_name = Office 2
cid_num = 1002

; --------------------------------------------------------------------------
; A custom softkey set (optional). Without one, phones get the built-in set.
; 'sccp show softkey sets' lists the built-in keys for each call state.
; --------------------------------------------------------------------------

;[mysoftkeys]
;type = softkeyset
;onhook = redial, newcall, cfwdall, dnd, pickup, gpickup
;offhook = redial, endcall, cfwdall, dnd, pickup, gpickup
;connected = hold, endcall, transfer, conf, park, monitor
;onhold = resume, newcall, endcall
;ringin = answer, idivert
